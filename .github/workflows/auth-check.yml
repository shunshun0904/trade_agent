# bitbank の認証付き API の疎通確認（参照系のみ、発注しない）。
# キーはリポジトリの Secrets（bitbank_API / bitbank_secret）から読む。
# Secrets の値は GitHub がログ上でマスクする。リポジトリは公開なので、
# スクリプトも残高の数値や注文の内容は出力しない。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、
# scripts/auth_check.py・bblive/private_client.py・このファイルを変更して push する。
name: auth-check
on:
  workflow_dispatch:
  push:
    branches: [claude/bitbank-trade-agent-7ers55]
    paths:
      - scripts/auth_check.py
      - bblive/private_client.py
      - .github/workflows/auth-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Auth check (read-only)
        env:
          PYTHONPATH: .
          BITBANK_API_KEY: ${{ secrets.bitbank_API }}
          BITBANK_API_SECRET: ${{ secrets.bitbank_secret }}
        run: python scripts/auth_check.py
