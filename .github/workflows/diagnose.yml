# 損失の要因分解（開発期間のみ）を実データで実行する。公開 API のみ、認証不要。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、configs/diagnose.yaml を変更して push する。
name: diagnose
on:
  workflow_dispatch:
  push:
    paths:
      - configs/diagnose.yaml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read period from config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d = yaml.safe_load(open("configs/research.yaml"))["data"]
          print(f"pair={d['pair']}")
          print(f"start={d['start']}")
          print(f"end={d['end']}")
          PY
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ github.run_id }}
          restore-keys: bbdata-raw-${{ steps.cfg.outputs.pair }}-
      - name: Download transactions
        timeout-minutes: 60
        run: python -m bbdata download --pairs ${{ steps.cfg.outputs.pair }} --start ${{ steps.cfg.outputs.start }} --end ${{ steps.cfg.outputs.end }}
      - name: Count experiment log lines
        id: pre
        run: echo "n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )" >> "$GITHUB_OUTPUT"
      - name: Run diagnosis
        run: python -m bbresearch diagnose --config configs/research.yaml --sets configs/diagnose.yaml --out reports/diagnose
      - run: cat reports/diagnose/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: >-
          scripts/commit_report.sh "${{ steps.pre.outputs.n }}" "Diagnosis report from run ${{ github.run_id }}"
          reports/diagnose/report.md reports/diagnose/report.json
