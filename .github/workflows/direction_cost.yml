# 目的変数を「費用（成行往復 約 0.3%）を超えて上がるか」に変え、下げ側も学習して差を信号にする二段構えのモデルを 15 分と 1 時間で学習し、2024 年以降で1回評価する。公開 API のみ、認証不要。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、configs/direction_cost.yaml か configs/direction_1h_cost.yaml を変更して push する。
name: direction-cost
on:
  workflow_dispatch:
  push:
    paths:
      - configs/direction_cost.yaml
      - configs/direction_1h_cost.yaml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  direction-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read period from config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d = yaml.safe_load(open("configs/research.yaml"))["data"]
          print(f"pair={d['pair']}")
          print(f"start={d['start']}")
          print(f"end={d['end']}")
          PY
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ github.run_id }}
          restore-keys: bbdata-raw-${{ steps.cfg.outputs.pair }}-
      - name: Download transactions
        timeout-minutes: 60
        run: python -m bbdata download --pairs ${{ steps.cfg.outputs.pair }} --start ${{ steps.cfg.outputs.start }} --end ${{ steps.cfg.outputs.end }}
      - name: Count experiment log lines
        id: pre
        run: echo "n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )" >> "$GITHUB_OUTPUT"
      - name: Run the 15-minute model
        run: python -m bbresearch direction --config configs/research.yaml --spec configs/direction_cost.yaml --out reports/direction_cost
      - name: Run the 1-hour model
        run: python -m bbresearch direction --config configs/research.yaml --spec configs/direction_1h_cost.yaml --out reports/direction_1h_cost
      - run: cat reports/direction_cost/report.md reports/direction_1h_cost/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: >-
          scripts/commit_report.sh "${{ steps.pre.outputs.n }}" "Direction cost-target reports from run ${{ github.run_id }}"
          reports/direction_cost/report.md reports/direction_cost/report.json
          reports/direction_1h_cost/report.md reports/direction_1h_cost/report.json
