# 画面に出す「1 時間後に 0.3% を超えて上がる確率」のモデル B を学習し、reports/direction_deploy/model_B.json に書き出す。公開 API のみ、認証不要。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、configs/direction_deploy.yaml を変更して push する。
name: direction-deploy
on:
  workflow_dispatch:
  push:
    paths:
      - configs/direction_deploy.yaml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  direction-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read period from config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d = yaml.safe_load(open("configs/research.yaml"))["data"]
          print(f"pair={d['pair']}")
          print(f"start={d['start']}")
          print(f"end={d['end']}")
          PY
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ github.run_id }}
          restore-keys: bbdata-raw-${{ steps.cfg.outputs.pair }}-
      - name: Download transactions
        timeout-minutes: 60
        run: python -m bbdata download --pairs ${{ steps.cfg.outputs.pair }} --start ${{ steps.cfg.outputs.start }} --end ${{ steps.cfg.outputs.end }}
      - name: Count experiment log lines
        id: pre
        run: echo "n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )" >> "$GITHUB_OUTPUT"
      - name: Train and export model B
        run: python -m bbresearch direction --config configs/research.yaml --spec configs/direction_deploy.yaml --out reports/direction_deploy
      - run: cat reports/direction_deploy/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check the exported model with the pure-Python evaluator
        run: python scripts/check_model_export.py reports/direction_deploy/model_B.json
      - name: Commit report
        run: >-
          scripts/commit_report.sh "${{ steps.pre.outputs.n }}" "Deploy model report from run ${{ github.run_id }}"
          reports/direction_deploy/report.md reports/direction_deploy/report.json reports/direction_deploy/model_B.json
