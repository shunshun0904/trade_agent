# 1 時間足の指標 → 収益率の条件付き分布（分位点回帰フォレスト）。公式 1 時間足を日付ごとに取り（公開 API、認証不要）、
# .cache/candles を Actions のキャッシュにためる（初回は約 2,100 リクエスト、以後は差分だけ）。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、configs/dist.yaml か scripts/dist_forecast.py を変更して push する。
name: dist
on:
  workflow_dispatch:
  push:
    branches: [claude/bitbank-trade-agent-7ers55]
    paths:
      - scripts/dist_forecast.py
      - configs/dist.yaml
      - .github/workflows/dist.yml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/candles
          key: candles-1hour-${{ github.run_id }}
          restore-keys: candles-1hour-
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: bbdata-raw-btc_jpy-${{ github.run_id }}
          restore-keys: bbdata-raw-btc_jpy-
      - name: Download transactions (skips days already cached)
        timeout-minutes: 300
        run: python -m bbdata download --pairs btc_jpy --start 2021-01-01 --end $(date -u +%Y-%m-%d)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: bbdata-raw-btc_jpy-${{ github.run_id }}
      - name: Fit and evaluate
        shell: bash
        env:
          PYTHONPATH: .
        run: python scripts/dist_forecast.py --config configs/dist.yaml --out reports/dist
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/candles
          key: candles-1hour-${{ github.run_id }}
      - run: cat reports/dist/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: >-
          scripts/commit_report.sh "$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )"
          "Distribution forecast report from run ${{ github.run_id }}" reports/dist/report.md reports/dist/metrics.json
