# 候補 2 の外部データの確認（Binance・Bybit の公開 API とアーカイブ、ドル円の候補）。認証なし、発注なし、リクエストは 30 件ほど。
# 2026-09-28 オーナー決定。実行方法: API の workflow_dispatch（ref にこのブランチ）か、scripts/ext_check.py かこのファイルを変更して push する。
name: ext-check
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ext_check.py
      - .github/workflows/ext_check.yml
permissions:
  contents: write
concurrency:
  group: ext-check-${{ github.ref }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          PYTHONPATH: .
        run: python scripts/ext_check.py --out reports/ext
      - name: Summary and commit
        run: |
          cat reports/ext/check.md >> "$GITHUB_STEP_SUMMARY"
          n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )
          scripts/commit_report.sh "$n" "External data check from run ${{ github.run_id }}" reports/ext/check.md reports/ext/check.json
