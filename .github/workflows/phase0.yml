# Phase 0 の実データ検証（公開 API のみ、認証不要）。
# workflow_dispatch は既定ブランチにこのファイルがないと使えないため、
# このファイルか scripts/phase0.py を変更して push したときにも実行する。
name: phase0
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/phase0.py
      - .github/workflows/phase0.yml
permissions:
  contents: write
concurrency:
  group: phase0-${{ github.ref }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run phase0
        env:
          PYTHONPATH: .
        run: python scripts/phase0.py --out reports/phase0
      - run: cat reports/phase0/phase0.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: phase0
          path: reports/phase0
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/phase0
          git commit -m "Phase 0 report from run ${{ github.run_id }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
