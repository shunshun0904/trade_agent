# ボラティリティを抑えるポートフォリオの前向き検証（公式日足、ペア × 年ごとに 1 リクエスト。公開 API のみ、認証不要）。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、scripts/portfolio.py を変更して push する。
name: portfolio
on:
  workflow_dispatch:
  push:
    branches: [claude/bitbank-trade-agent-7ers55]
    paths:
      - scripts/portfolio.py
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Portfolio walk-forward
        env:
          PYTHONPATH: .
        run: python scripts/portfolio.py
      - run: cat reports/portfolio/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: >-
          scripts/commit_report.sh "$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )"
          "Portfolio report from run ${{ github.run_id }}" reports/portfolio/report.md reports/portfolio/weights.json
