# リバランス計画（ドライラン。発注しない）。毎月 1 日に銘柄と相対の重みを選び直し（monthly）、毎週月曜に JPY の割合だけ見直す（weekly。目標ボラとトレンドフィルタ）。
# 起動は Claude の Routine（毎日 09:50 JST。1 日は monthly、月曜は weekly を workflow_dispatch）。
# GitHub の schedule は遅れや欠落が多く、Routine と二重に記録したので 2026-10-03 に外した（オーナー決定）。
# 残高はキー（Secrets bitbank_API / bitbank_secret）で読むが、ログには割合（%）だけを出す（公開リポジトリ）。
name: rebalance
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto（1 日なら monthly、他は weekly）/ monthly / weekly"
        required: false
        default: auto
  push:
    branches: [claude/bitbank-trade-agent-7ers55]
    paths:
      - scripts/rebalance.py
      - configs/rebalance.yaml
      - .github/workflows/rebalance.yml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the latest records
        # 同時に動いた別の実行が push した記録を取り込んでから追記・描画する（古い記録で画面を上書きしない）
        run: git fetch -q origin "$GITHUB_REF_NAME" && (git checkout "origin/$GITHUB_REF_NAME" -- docs/monitor || true)
      - name: Plan (dry run)
        shell: bash
        env:
          PYTHONPATH: .
          BITBANK_API_KEY: ${{ secrets.bitbank_API }}
          BITBANK_API_SECRET: ${{ secrets.bitbank_secret }}
        run: python scripts/rebalance.py --config configs/rebalance.yaml --mode "${{ github.event.inputs.mode || 'auto' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the monitor page
        env:
          PYTHONPATH: .
        run: python scripts/snapshot.py --page-only
      - name: Commit the plan
        run: >-
          scripts/commit_report.sh "$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )"
          "Rebalance plan $(date -u +%Y-%m-%d)" docs/monitor/rebalances.jsonl docs/monitor/index.html
