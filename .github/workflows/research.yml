# 研究パイプライン（Phase 2〜6）を実データで実行する。公開 API のみ、認証不要。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、
# configs/research.yaml を変更して push する。
name: research
on:
  workflow_dispatch:
  push:
    paths:
      - configs/research.yaml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  # configs/research.yaml の run_on_actions が true のときだけ実行する
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          python3 -c "import yaml; print('enabled=' + str(bool(yaml.safe_load(open('configs/research.yaml')).get('run_on_actions'))).lower())" >> "$GITHUB_OUTPUT"
  run:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read period from config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d = yaml.safe_load(open("configs/research.yaml"))["data"]
          print(f"pair={d['pair']}")
          print(f"start={d['start']}")
          print(f"end={d['end']}")
          PY
      # 過去の約定は確定しているので、前回までに取得した分をキャッシュから戻す
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ steps.cfg.outputs.start }}-${{ steps.cfg.outputs.end }}
          restore-keys: bbdata-raw-${{ steps.cfg.outputs.pair }}-
      - name: Download transactions
        run: python -m bbdata download --pairs ${{ steps.cfg.outputs.pair }} --start ${{ steps.cfg.outputs.start }} --end ${{ steps.cfg.outputs.end }}
      # 後続のステップが失敗しても取得済みのデータを残すため、取得直後に保存する
      - uses: actions/cache/save@v4
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ steps.cfg.outputs.start }}-${{ steps.cfg.outputs.end }}
      - run: du -sh data/raw && free -h
      # この実行で実験ログに追記した行だけを、後でリモートの最新に足すため
      - name: Count experiment log lines
        id: pre
        run: echo "n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )" >> "$GITHUB_OUTPUT"
      - name: Run research pipeline
        run: python -m bbresearch run --config configs/research.yaml --out reports/research
      - run: cat reports/research/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: research
          path: reports/research
      # 実行中に別の実行のレポートが push されていても衝突しないよう、リモートの最新に
      # この実行のレポートを載せ直してから push する（実験ログは追記した行だけを足す）
      - name: Commit report
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp reports/research/report.md reports/research/report.json "$tmp/"
          tail -n "+$(( ${{ steps.pre.outputs.n }} + 1 ))" reports/experiments.jsonl > "$tmp/new_trials.jsonl"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard
            git checkout -q -B report-update "origin/${GITHUB_REF_NAME}"
            mkdir -p reports/research
            cp "$tmp/report.md" "$tmp/report.json" reports/research/
            cat "$tmp/new_trials.jsonl" >> reports/experiments.jsonl
            git add reports/research/report.md reports/research/report.json reports/experiments.jsonl
            git commit -q -m "Research report from run ${{ github.run_id }}" || exit 0
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $(( attempt * 5 ))
          done
          exit 1
