# パラメータ探索（SPEC §7 の範囲、開発期間のみ）を実データで実行する。公開 API のみ、認証不要。
# 実行方法: API の workflow_dispatch（ref にこのブランチを指定）か、
# configs/search.yaml を変更して push する（run_on_actions が true のとき）。
name: search
on:
  workflow_dispatch:
  push:
    paths:
      - configs/search.yaml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          python3 -c "import yaml; print('enabled=' + str(bool(yaml.safe_load(open('configs/search.yaml')).get('run_on_actions'))).lower())" >> "$GITHUB_OUTPUT"
  search:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read period from config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d = yaml.safe_load(open("configs/research.yaml"))["data"]
          print(f"pair={d['pair']}")
          print(f"start={d['start']}")
          print(f"end={d['end']}")
          PY
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ github.run_id }}
          restore-keys: bbdata-raw-${{ steps.cfg.outputs.pair }}-
      - name: Download transactions
        timeout-minutes: 300
        run: python -m bbdata download --pairs ${{ steps.cfg.outputs.pair }} --start ${{ steps.cfg.outputs.start }} --end ${{ steps.cfg.outputs.end }}
      - uses: actions/cache/save@v4
        if: always() && steps.cfg.outcome == 'success'
        with:
          path: data/raw
          key: bbdata-raw-${{ steps.cfg.outputs.pair }}-${{ github.run_id }}
      - run: du -sh data/raw && free -h && nproc
      - name: Count experiment log lines
        id: pre
        run: echo "n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )" >> "$GITHUB_OUTPUT"
      - name: Run parameter search
        run: python -m bbresearch search --config configs/research.yaml --grid configs/search.yaml --out reports/search
      - run: cat reports/search/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: search
          path: reports/search
      - name: Commit report
        run: |
          files="reports/search/report.md reports/search/report.json reports/search/screen.csv"
          [ -f reports/search/selected.yaml ] && files="$files reports/search/selected.yaml"
          scripts/commit_report.sh "${{ steps.pre.outputs.n }}" "Search report from run ${{ github.run_id }}" $files
