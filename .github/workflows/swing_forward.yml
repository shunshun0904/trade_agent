# スイングの研究の H1（時系列モメンタム 24 通り）の前向きのドライラン（発注しない。公開 API のみ、認証不要）。
# 2026-09-28 オーナー決定: 2026-09-28 00:00 UTC から 12 か月、毎月 1 回報告し、2027-09-28 に判定する（configs/swing_forward.yaml）。
# 毎月 1 日 00:40 UTC（schedule は既定ブランチでだけ動く）。scripts/swing_forward.py・configs/swing_forward.yaml・このファイルの
# 変更の push と workflow_dispatch でも動く。評価に使ったファイルの SHA-256 が変わっていたら scripts/swing_forward.py が止める。
name: swing-forward
on:
  workflow_dispatch:
  schedule:
    - cron: "40 0 1 * *"
  push:
    paths:
      - scripts/swing_forward.py
      - configs/swing_forward.yaml
      - .github/workflows/swing_forward.yml
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/swing
          key: swing-candles-${{ github.run_id }}
          restore-keys: swing-candles-
      - name: Count experiment log lines
        id: pre
        run: echo "n=$( [ -f reports/experiments.jsonl ] && wc -l < reports/experiments.jsonl || echo 0 )" >> "$GITHUB_OUTPUT"
      - name: Forward dry run
        env:
          PYTHONPATH: .
        run: python scripts/swing_forward.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/swing
          key: swing-candles-${{ github.run_id }}
      - run: cat reports/swing_forward/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: >-
          scripts/commit_report.sh "${{ steps.pre.outputs.n }}" "Swing forward dry run from run ${{ github.run_id }}"
          reports/swing_forward/report.md reports/swing_forward/metrics.json reports/swing_forward/history.jsonl
