# Trade Agent — default configuration.
#
# Every number the spec calls out as "configurable" lives here. Nothing in the
# source hard-codes an exchange constant, a risk limit or a schedule.
#
# Overrides, highest priority last:
#   1. this file
#   2. config/<environment>.yaml   (environment = TA_ENV, default "dev")
#   3. environment variables       TA_<SECTION>__<KEY> (e.g. TA_SYSTEM__PAPER_TRADING=false)

system:
  environment: dev
  # Phase 1 (paper trading) kill-flag. While true the executor logs orders and
  # never reaches the exchange's private API. Spec 17.3.
  paper_trading: true
  # 1 = paper, 2 = minimum-lot live, 3 = full risk sizing. Spec 13.
  phase: 1
  display_timezone: Asia/Tokyo
  log_level: INFO

exchange:
  name: bitbank
  pair: btc_jpy
  public_base_url: https://public.bitbank.cc
  private_base_url: https://api.bitbank.cc/v1
  # Spec 2. Verified at runtime against GET /v1/spot/pairs by
  # `trade-agent verify-pair` and (when enabled) on executor start-up.
  min_order_btc: "0.0001"
  amount_digits: 8
  price_digits: 0
  maker_fee_rate: "-0.0002"   # -0.02% (rebate)
  taker_fee_rate: "0.0012"    # +0.12%
  verify_pair_settings: true
  http_timeout_seconds: 10
  max_retries: 4
  retry_base_delay_seconds: 1.0
  rate_limit:
    query_per_second: 10      # bitbank documented QUERY limit
    update_per_second: 6      # bitbank documented UPDATE limit (order/cancel)
  private_failure_threshold: 3   # consecutive failures before "stand down + notify"

capital:
  initial_equity_jpy: 10000
  monthly_target_pct: 10      # target, never a constraint (spec 0/1)

risk:
  per_trade_risk_pct: 1.0
  probe_risk_pct: 0.5
  daily_loss_limit_pct: 3.0
  losing_streak_limit: 3
  losing_streak_pause_hours: 24
  flash_move_pct: 3.0
  flash_move_window_minutes: 15
  flash_move_pause_hours: 1
  killswitch_drawdown_pct: 20.0
  max_concurrent_positions: 1

boredom:
  # Off. With screening.consensus_min at 1 this rule has nothing left to do:
  # its only lever is relaxing consensus to `relaxed_consensus_min`, which is
  # now the same value as the normal path, so firing it would change nothing.
  # A 72-hour gap without a trade is also no longer expected.
  #
  # The code is still here rather than deleted: `boredom`/`probe` reaches 15
  # modules and `state.monthly.probe_*` is persisted in DynamoDB, so removing
  # it is its own piece of work, to be done once the new frequency is confirmed
  # against real data.
  enabled: false
  no_trade_hours: 72
  relaxed_consensus_min: 1     # 1/3 instead of 2/3
  probe_sl_pct: 0.7            # SL within -0.7% of entry
  monthly_probe_loss_limit_pct: 2.0
  mechanical_probe_vwap_hours: 24
  mechanical_probe_discount_pct: 0.2   # limit price = VWAP * (1 - 0.2%)

guard:
  max_retries: 3
  entry_max_deviation_pct: 2.0
  # Quoted indicator values must match the snapshot within this relative
  # tolerance, otherwise the agent is judged to have fabricated a number.
  indicator_tolerance_pct: 0.5

execution:
  requote_max_deviation_pct: 0.3
  post_only_timeout_minutes: 60
  tp_exit_timeout_minutes: 30
  lock_lease_seconds: 600
  pending_order_stale_minutes: 90

  # Hand-rolled OCO (spec 8). bitbank has no OCO endpoint, so the two legs are
  # placed separately and the survivor is cancelled when one fills.
  #   local        - no exchange-side legs; the 5-minute tick evaluates SL/TP.
  #   exchange_oco - place both legs on the exchange.
  #   auto         - try exchange_oco, fall back per-position if the second leg
  #                  is refused (a spot balance can only back one sell).
  # Default `auto`: it is the only setting that is correct whichever way
  # bitbank reserves balance for an INACTIVE stop order — a question that can
  # only be settled against the live exchange. See docs/OPEN-QUESTIONS.md A-1.
  oco_mode: auto
  # `stop` = market on trigger (certain exit, uncertain price).
  # `stop_limit` = limit on trigger (certain price, may not fill at all).
  # Spec 8 permits taker execution for stops, and a stop that does not fill is
  # the worse failure, so `stop` is the default.
  stop_order_type: stop
  # For stop_limit only: how far below the trigger to place the limit.
  stop_limit_offset_pct: 0.3
  # Local evaluation stays armed even when the exchange holds the legs, so a
  # rejected or vanished stop cannot leave the position unprotected.
  local_backstop: true

schedule:
  tick_minutes: 5
  screen_minutes: 30
  full_debate_cooldown_minutes: 30
  floor_times_jst: ["09:00", "21:00"]
  daily_report_time_jst: "21:00"

screening:
  breakout_lookback_hours: 24
  rsi_period: 14
  # Loosened from 30/70, 2.0 and 1.0. Those fire on genuine extremes, which is
  # correct for "is this remarkable" and too strict for "is this worth a look":
  # over the first days of paper trading no market trigger fired at all, and the
  # only debates came from the 09:00/21:00 floors.
  rsi_low: 40
  rsi_high: 60
  volume_spike_multiple: 1.5
  vwap_deviation_pct: 0.5
  scout_mode: false            # spec 9: optional 1-call LLM scout, default OFF
  # How many of the three independent proposals must say "buy" before the judge
  # runs. The largest single control on trade frequency: the first cycles all
  # reached phase 2 and stopped here, 0-1 buys against a required 2.
  #
  # At 1 the meaning changes, deliberately. This is no longer a consensus —
  # one strategist finding a setup is enough, and the other two disagreeing
  # does not veto it. The three proposals stay independent (spec 4.1) and the
  # critique round still runs; what they no longer do is outvote each other.
  consensus_min: 1

# LLM review of an OPEN position (docs/OPEN-QUESTIONS.md D-1).
#
# Off. The exits are deterministic today, and the risk this adds — cutting
# winners short — cannot be seen without deterministic closed trades to compare
# against. Turn it on once `get_trades` has a few rows, so the exit_reason
# breakdown has a baseline.
#
# What it can do is one-way by construction: raise the stop, lower the target,
# or nothing. Widening either is refused by the guard, so the model cannot add
# risk to a live position. The 5-minute tick and the exchange-side stop are
# untouched and keep working with the LLM unavailable.
exit_review:
  enabled: false
  min_minutes: 30           # floor between reviews; same cadence as screen
  # The real throttle. With the floor at 30 minutes, a quiet market falls
  # through to max_idle_minutes and reviews once every 4 hours. Fewer decision
  # points is also the most reliable brake on over-trading the exit.
  atr_multiple: 0.5
  max_idle_minutes: 240
  max_reviews_per_position: 12

snapshot:
  candle_type: 1hour
  candle_limit: 200
  short_candle_type: 5min
  short_candle_limit: 120
  depth_levels: 10
  lessons_in_prompt: 12

llm:
  provider: anthropic
  # Moved off claude-haiku-4-5 after reading a full agent log: the pessimist
  # compared a 62,000-yen move against a 47,211-yen ATR and called it
  # "overwhelmingly smaller", and proposed a 10,200-yen stop on a 12,435,000-yen
  # asset. The critique agents caught both, which is the protocol working, but
  # arithmetic that wrong is not something to design around.
  model: claude-sonnet-5
  max_tokens: 2000
  timeout_seconds: 60
  max_api_retries: 2
  use_prompt_cache: true
  # The model will not create a cache entry below this prefix size; shorter
  # prefixes silently cost full price, so the runner warns instead.
  #
  # This is per model and NOT monotonic across generations: haiku-4-5 needs
  # 4096, sonnet-5 needs 1024. The shared prefix measured ~3,800 tokens, which
  # is why cache_read_tokens was 0 on every call under haiku — 300 tokens short
  # of a threshold sonnet clears with room to spare.
  cache_min_tokens: 1024
  structured_output: true       # messages.parse(output_format=...)
  batch_api_for_reflect: true   # spec 11: A7 may use the 50%-off Batch API
  pricing:
    cache_write_multiplier: 1.25
    cache_read_multiplier: 0.10
    batch_multiplier: 0.50
    # Keyed by model id. A single global block would keep billing at the old
    # rates after `model:` changed above — the ledger would report half of what
    # sonnet actually costs and the 100% hard stop would never fire. A model
    # missing from this table is refused at startup rather than mispriced.
    models:
      claude-sonnet-5:
        input_per_mtok_usd: 2.00
        output_per_mtok_usd: 10.00
      claude-haiku-4-5:
        input_per_mtok_usd: 1.00
        output_per_mtok_usd: 5.00
  usd_jpy_rate: 155.0

cost:
  total_budget_jpy: 3000
  infra_cost_jpy: 100          # spec 1: conservative fixed value, update from AWS Budgets
  stop_threshold_pct: 100      # -> no LLM calls at all (tick/SL/TP keep running)

  # Spending is paced daily instead of capped by a debate count:
  #
  #   today's allowance = (budget - spent this month) / days left * multiplier
  #
  # A count was only ever standing in for money, and badly: a cycle is seven
  # or nine calls depending on whether consensus is reached, and cache hits
  # move it again. Busy days and quiet days are both fine now — spending
  # heavily today leaves less to divide tomorrow, so the month self-corrects
  # without ever refusing a trade for having used up a quota.
  #
  # 2.0 lets one day spend twice the even pace. At 3000-100 = 2900/month that
  # is roughly 193 JPY on a 30-day month. Provisional: revisit once
  # agent_calls shows the real cost of a cycle (prompt caching may not be
  # engaging — see the 4096-token warning in agents/base.py).
  daily_allowance_multiplier: 2.0

reflect:
  min_trades_for_lessons: 20   # spec 9: aggregate statistics, never single-trade verdicts
  lookback_trades: 60
  max_lessons_per_run: 5

storage:
  backend: dynamodb            # dynamodb | memory
  table_prefix: trade-agent
  s3_bucket: ""
  agent_log_prefix: agent-logs/
  backup_prefix: backups/

notify:
  enabled: true
  ses_region: ap-northeast-1
  from_address: ""
  to_address: ""

mcp:
  server_name: trade-agent
  protocol_version: "2025-06-18"
  ssm_bearer_token_param: /trade-agent/mcp/bearer-token

secrets:
  ssm_bitbank_api_key: /trade-agent/bitbank/api-key
  ssm_bitbank_api_secret: /trade-agent/bitbank/api-secret
  ssm_anthropic_api_key: /trade-agent/anthropic/api-key
