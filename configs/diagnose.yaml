# 損失の要因分解（python -m bbresearch diagnose）で比べるパラメータの組。開発期間のみを使う。
# ホライズン別の測定（案 A）で使う h（15 分足の本数）: 15分・1時間・4時間・8時間・1日・2日・4日・1週間
horizons: [1, 4, 16, 32, 96, 192, 384, 672]
sets:
  initial:            # SPEC §7 の初期値
    signal.k_h: 2.0
    label.k_up: 2.0
    label.k_dn: 2.0
    label.n_v: 8
    label.delta: 0.0
    label.t_fill_min: 15
  selected:           # 2026-09-23 のパラメータ探索で選んだ組（reports/search/selected.yaml）
    signal.k_h: 4.0
    label.k_up: 3.0
    label.k_dn: 4.0
    label.n_v: 16
    label.delta: 0.001
    label.t_fill_min: 15
# 案 B: 逆選択を減らすエントリー方法の比較（post_only 指値のまま、出す時点と価格を変える）
#   wait_bars: t0 から何本待って指値を出すか / require_up: その間に下げが止まった（終値 ≥ t0 の終値）場合だけ
#   require_imbalance: 直前の足の買い出来高が売りを上回った場合だけ / delta, delta_sigma: 指値を終値からどれだけ下げるか
entry_rules:
  immediate: {}
  wait1_up: {wait_bars: 1, require_up: true}
  wait2_up: {wait_bars: 2, require_up: true}
  wait4_up: {wait_bars: 4, require_up: true}
  wait1_imb: {wait_bars: 1, require_imbalance: true}
  deep_0.5sigma: {delta_sigma: 0.5}
  deep_1sigma: {delta_sigma: 1.0}
  deep_2sigma: {delta_sigma: 2.0}
only_entry: true   # 要因分解・ホライズンは実施済みなので、エントリーの比較だけを行う
