# 15 分後の上げ下げを予測する二段構えのモデル（python -m bbresearch direction）。2026-09-25 オーナー決定。
# A: 15 分ごと（足の区切り）に判断する。B: 1 分ごとに予測し、直近 15 分の B の予測を A の特徴量に加える。
# 特徴量は全部（1 分足の流れ、15 分足、価格帯別出来高・TPO、時刻）。
# 学習・交差検証は data.start 〜 train_end、評価は train_end 〜 data.end で1回だけ。A 単独と A+B を比べる。
train_end: "2024-01-01"
n_splits: 5
thetas: [0.55, 0.6]     # 損益の計算で買う確率のしきい値
n_boot: 200             # AUC の差の日単位ブートストラップの回数
