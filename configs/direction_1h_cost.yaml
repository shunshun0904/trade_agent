# 目的変数を「60 分後に成行往復の費用（約 0.3%）を超えて上がるか」に変え、下げ側も学習して差を信号にする版（2026-09-26 オーナー指示）。
# それ以外は configs/direction_1h.yaml と同じ（毎正時に判断、直近 60 分の B の要約と水準の推移を加える）。
train_end: "2024-01-01"
horizon_min: 60
target_min_return: taker_round_trip
two_sided: true          # 下げ側（r < −c）も学習し、上げ確率 − 下げ確率を信号にする（2026-09-26 オーナー指示）
diff_thetas: [0.05, 0.1, 0.2]   # 信号のしきい値
level_summary: true
n_splits: 5
thetas: [0.3, 0.4]
top_fracs: [0.1, 0.05]
n_boot: 200
