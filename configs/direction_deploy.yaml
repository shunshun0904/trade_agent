# 画面に出す「1 時間後に 0.3% を超えて上がる確率」（ボラティリティの目安）のモデルを学習して書き出す
# （2026-09-26 オーナー決定: 上げ側のモデルをそのまま使う、1 時間だけ）。
# configs/direction_1h_cost.yaml と同じ学習だが、下げ側と水準の推移（A+B+L）は省いて B（1 分ごと）を書き出す。
# 出力: reports/direction_deploy/model_B.json（木の JSON、特徴量の名前、学習期間、評価期間の AUC）。
train_end: "2024-01-01"
horizon_min: 60
target_min_return: taker_round_trip
n_splits: 5
thetas: [0.3, 0.4]
top_fracs: [0.1, 0.05]
n_boot: 200
export_model: true
