# 1 時間足のテクニカル指標から「今買った場合の収益率の分布」をノンパラメトリックに推定する（scripts/dist_forecast.py）。
# 2026-09-27 オーナー決定: 分位点回帰フォレスト、ホライズン 4 時間、btc_jpy、評価は分布の精度（ピンボール損失・CRPS・較正）。
pair: btc_jpy
start: "2021-01-01"        # 学習データの開始（1 時間足は日付ごとに 1 リクエスト。.cache/candles にためる）
split: "2024-01-01"        # これより前で学習、以後で 1 回評価
horizon: 4                 # 足 t の終値で買い、4 本後の終値で売る
cost: 0.003                # 成行往復の費用（手数料 0.12% × 2 + 滑り）。P(収益率 > cost) を出す
forest:
  n_estimators: 300
  max_features: 0.33                      # max_features_grid がないときの値
  max_samples: 0.5
  min_samples_leaf_grid: [25]             # 3 回目のローリング検証で葉 25・√p を選んだ（12 組の差は 2% 未満）。以後は固定
  max_features_grid: [sqrt]
validation:
  n_folds: 3          # 学習期間の末尾を時系列順に 3 区間に区切り、各区間をそれより前のデータで学習して評価する
  block_frac: 0.15    # 1 区間 = 学習行数の 15%
baselines:
  rolling_n: [168, 720]    # 直近 7 日 / 30 日の経験分布（ボラの変化を追う基準）
quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
variants:                  # 2026-09-27 オーナー決定: 手法の変種。標準化 = 目的変数を σ_t（直近 24 本の実現ボラ × √4）で割って学習し掛け戻す。
  - {name: 標準化, standardize: true, split: mean}                   # bins = 目的変数を分位点で 8 区間に分けた one-hot を多出力にして分割（GRF の近似）
  - {name: 分位点ビン分割, standardize: false, split: bins}
  - {name: 標準化 + 分位点ビン分割, standardize: true, split: bins}
n_bins: 8
subsets: {}                # 群ごとの学習は 2 回目で済んだので、この実行では省く
subsets_reference:         # 群ごとに学習して、どの群が分布を改善するかを見る（列名の接頭辞。2026-09-27 に指標を 373 個へ拡充）
  トレンド系だけ: [t_]
  オシレーター系だけ: [o_]
  ボラ・出来高だけ: [v_]
  水準・パターンだけ: [p_]
  テクニカル評価と時刻だけ: [r_, c_]
  ボラ・出来高以外: [t_, o_, p_, r_, c_]
