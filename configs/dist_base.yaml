# 評価の土台（候補 1）: ボラだけの基準（HAR 型・GARCH-t 型）に対する、分位点回帰フォレストの幅と向きの上乗せ（scripts/dist_base.py）。
# 2026-09-28 オーナー決定: 評価は 2024-01〜 で 1 回（これまでの 5 回と同じ期間割り。診断として扱い、売買の判断には使わない。
# 向きの上乗せが見えたときだけ前向きの期間で確かめる）、btc_jpy の 4 時間と 24 時間、帰無の監査は 2 モデル × 20 回（同日に実データの符号の入れ替えを加えて 3 モデル × 20 回）、学習は 1 回だけ。
# 数値は評価の前に固定する。評価（--mode eval）は owner_approved にオーナーの承認日が入っているときだけ動く。
owner_approved: null
pair: btc_jpy
start: "2021-01-01"          # 1 時間足と約定（1 分の終値）の開始
split: "2024-01-01"          # これより前で 1 回だけ学習、以後で評価
end: null                    # データの終わり（含まない）。null なら実行日の UTC 0 時（その日の形成中の足は使わない）
horizons: [4, 24]            # 足 t の終値で買い、h 本後の終値で売った対数収益率
trades_root: data            # 約定の保存先（bbdata download。Actions のキャッシュ）
cost: 0.003                  # 成行往復の費用。P(収益率 > c) の c、閾値で重みを付けた CRPS の閾値、初等スコアの θ に使う
quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
thresholds: [0.0, 0.003, -0.003]   # P(収益率 > c)。主指標は c = 0 のブライアスコア
logloss_eps: 0.001           # 対数損失で確率を [ε, 1 − ε] に切る
elementary_theta: 0.003      # 「予測平均が θ を超えたら買う」の θ（= 費用）
murphy_thetas: [0.0, 0.001, 0.002, 0.003, 0.004, 0.005, 0.006]
top_share: 0.2               # 予測平均の上位・下位 20% の実現リターンの差
forest:                      # scripts/dist_forecast.py の 4 回目で最良の設定（分位点ビン分割、葉 25、√p）。特徴量は 1 時間足の指標 373 個
  n_estimators: 300
  min_samples_leaf: 25
  max_features: sqrt
  max_samples: 0.5
  split_target: bins
  n_bins: 8
  random_state: 0
har:
  windows: [1, 4, 24, 168]   # log(直近 k 本の RV の平均)
  calendar: true             # 時刻（23 個）と曜日（6 個）のダミー
  rv_floor: 1.0e-10          # RV の下限（約定のない時間の log(0) を避ける）
rolling_n: [168, 720]
sign_magnitude:              # 符号と大きさの分解: 大きさは HAR 型、符号は LightGBM（指標 373 個と |z|）
  grid: 50                   # |z| の分位点の数
  valid_frac: 0.2            # 学習期間の末尾 20% で木の数を早期停止で決め、学習期間全体で学習し直す
  early_stopping_rounds: 50
  lgbm: {n_estimators: 2000, learning_rate: 0.02, num_leaves: 15, min_child_samples: 200, subsample: 0.5, subsample_freq: 1,
         colsample_bytree: 0.5, reg_lambda: 1.0, random_state: 0}
tests:
  nw_mult: 1.3               # fixed-b（Bartlett）の帯域 M = ⌈1.3 √P⌉
  ewc_mult: 0.4              # EWC の自由度 B = ⌊0.4 P^(2/3)⌋
  fixedb_sims: 10000         # fixed-b の p 値の模擬の回数
  bootstrap_reps: 999        # 定常ブートストラップ（評価だけ。帰無の監査では省く）
  mcs_size: 0.10             # モデル信頼集合（CRPS、P(>0) のブライアスコア）
  mcs_reps: 500
  mcs_block: 168
  acf_lags: [1, 4, 24, 168]
  hill_share: 0.01
  seed: 0
null_audit:
  models: [garch_t, ms2, sign_flip]   # 期待リターン 0 の合成データ（bbresearch/nullsim.py）。sign_flip は 2026-09-28 オーナー決定で追加
  reps: 20                   # モデルごとの回数
  seed0: 1000                # 回ごとの乱数の種 = seed0 + 通し番号
  shards: 20                 # Actions で並列に分ける数（1 回あたり約 25 分なので、1 ジョブ 3 回）
judge:
  primary: brier_0           # 向きの主指標: P(収益率 > 0) のブライアスコア（小さいほど良い）
  comparisons:               # [向きのモデル, 向きの情報を持たない参照]
    - [forest, forest_fixed]
    - [sign_magnitude, har]
  alpha: 0.05                # 2 比較 × 2 ホライズンの 4 検定をホルム法でまとめた有意水準。fixed-b と EWC の両方で有意なこと
  null_alpha: 0.05           # 帰無の監査: (1 + 合成データの改善が実データ以上の回数) / (1 + 回数（60）) < 0.05
  width_pair: [forest, har]  # 幅の比較（CRPS。fixed-b の両側 5%）
