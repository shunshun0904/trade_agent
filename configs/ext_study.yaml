# 候補 2（24 時間の新しい情報源）の研究。2026-09-28 オーナー決定（docs/SPEC.md の「24 時間の新しい情報源」の節）。
# 今は check（データの確認。期間・抜け・書式、事象の数。先の収益率は出さない）だけ。事前登録の数値（事象の閾値・統制・指標・
# 帰無・判定）は check の結果を見てから加え、オーナーの承認後（owner_approved に日付）に 1 回だけ評価する。
# 外部データは認証なしの公開の窓口とアーカイブだけ（Binance のアーカイブ、BitMEX、Deribit、Dukascopy、FRED）。発注・口座は使わない。
owner_approved: null
pair: btc_jpy
binance_symbol: BTCUSDT
start: "2020-01-01"            # Binance のアーカイブ（資金調達率・永久先物・プレミアム指数）の最初の月（§9 E1）
end: "2026-09-01"              # 終わり（含まない）。確定した月まで
window: "180D"                 # 信号の順位を取る直前の期間（自分自身は含めない）
min_days: 90                   # 順位を出すのに要る直前の履歴の日数
check_thresholds: [0.05, 0.10] # check で数える事象の閾値（順位が下位・上位 q 以内）。どちらを使うかは check の後に決める
metrics_start: "2020-01-01"    # 建玉などの記録（日ごとのファイル）を探し始める日。ない日は 404 として記録し、取り直さない
cache: .cache/ext
