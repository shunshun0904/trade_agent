# 候補 2（24 時間の新しい情報源）の研究。2026-09-28 オーナー決定（docs/SPEC.md の「24 時間の新しい情報源」の節）。
# check: データの確認（期間・抜け・書式、事象の数。先の収益率は出さない）。
# eval: 下の eval の数値（事前登録）で 1 回だけ評価する。owner_approved に承認の日付が入るまで動かない。
# 外部データは認証なしの公開の窓口とアーカイブだけ（Binance のアーカイブ、BitMEX、Deribit、Dukascopy、FRED）。発注・口座は使わない。
owner_approved: "2026-09-28"   # オーナー承認（2026-09-28、事前登録どおりに 1 回だけ評価する）
pair: btc_jpy
binance_symbol: BTCUSDT
start: "2020-01-01"            # Binance のアーカイブ（資金調達率・永久先物・プレミアム指数）の最初の月（§9 E1）
end: "2026-09-01"              # 終わり（含まない）。確定した月まで
window: "180D"                 # 信号の順位を取る直前の期間（自分自身は含めない）
min_days: 90                   # 順位を出すのに要る直前の履歴の日数
check_thresholds: [0.05, 0.10] # check で数える事象の閾値（順位が下位・上位 q 以内）
metrics_start: "2020-01-01"    # 建玉などの記録（日ごとのファイル）を探し始める日。ない日は 404 として記録し、取り直さない
cache: .cache/ext
trades_root: data              # bitbank の約定（bbdata の保存先）。HAR 型の 1 分の実現分散に使う

# ---- 事前登録（2026-09-28 オーナー決定。SPEC の「24 時間の新しい情報源」の節）
eval:
  grid_hours: [0, 8, 16]       # 判断の時刻（UTC、資金調達の決済の時刻）。信号はその時刻に分かっている最新の値
  horizon_hours: 24            # 結果: 判断の時刻の bitbank の終値から 24 時間後の終値までの対数収益率
  q: 0.10                      # 事象: 順位が下位 10% 以下・上位 10% 以上（90% 以上）
  gap_hours: 24                # 事象として数えた時刻から 24 時間の間の事象は数えない。統制は前後 24 時間に同じ側の事象がない時刻
  staleness_hours: {funding: 8, hourly: 2}   # 判断の時刻に使う値の古さの上限（資金調達率、1 時間ごとの信号）
  zbins: [-2, -1, 1, 2]        # 統制をそろえる直前 24 時間の値動き z の区分（5 つ）
  z_vol_hours: 720             # z の分母: 直前 720 本の 1 時間の対数収益率の標準偏差 × √24
  z_min_hours: 480
  cost: 0.003                  # 往復の費用。上げ下げの仮説は事象の後の平均が +0.3% を超える（上位側は −0.3% を下回る）ことも条件
  alpha: 0.05                  # 主な検定 6 つを Holm 法で補正した後の有意水準（片側）
  tail_ratio: 2.0              # 下側の裾: 事象の後に HAR 型の 5% 点を下回る割合が、統制の 2 倍以上であることも条件
  tail_quantile: 0.05
  null_reps: 999               # 循環シフトの回数
  min_shift_days: 30           # 循環シフトのずらし幅の下限（両端とも）
  seed: 20260928
  har: {windows: [1, 4, 24, 168], calendar: true, rv_floor: 1.0e-10, min_train_days: 60, quantiles: [0.05, 0.01]}
  primary:                     # 主な検定（Holm の対象）。direction: +1 は事象の後が統制より高い、−1 は低い
    - {id: H1a, signal: funding_binance, side: low, kind: mean, direction: 1}
    - {id: H1b, signal: funding_binance, side: high, kind: mean, direction: -1}
    - {id: H2a, signal: jpy_premium, side: low, kind: mean, direction: 1}
    - {id: H2b, signal: jpy_premium, side: high, kind: mean, direction: -1}
    - {id: H3a, signal: carry, side: high, kind: tail, direction: 1}
    - {id: H3b, signal: oi_change, side: high, kind: tail, direction: 1}
  venue_check: [funding_bitmex, funding_deribit]   # H1a・H1b は、この 2 つでも統制との差が同じ向きであることを条件にする
  forward_months: 6            # 支持した仮説だけ、同じ数値で 6 か月の前向きのドライラン（発注しない）
