# 研究パイプラインの設定。値は SPEC.md §7 の初期値（検証の出発点としての提案値）。
# true にして push すると GitHub Actions で実データに対して実行する（.github/workflows/research.yml）
run_on_actions: true
seed: 0
data:
  root: data
  pair: btc_jpy
  # U4（2026-09-23 決定）: 取得できる最古日（V3）から全期間を使う
  start: "2017-02-14"
  end: "2026-09-22"
  large_trade_amount: null        # 【未決】null なら large_share 特徴量を作らない
split:
  holdout_days: 180               # U5（2026-09-23 決定）。再学習は当面行わず、開発期間で一度だけ学習する
  # 2026-09-23 の評価でホールドアウトは使用済み。以後の設定選びには使わないので評価しない
  evaluate_holdout: false
# signal / label は 2026-09-23 のパラメータ探索で選んだ設定（reports/search/selected.yaml）。
# ホールドアウトで評価する対象は dip/threshold_0.6/lgbm の1つだけ（探索の前に決めた基準で選択）。
signal:
  sigma_span: 96
  k_h: 4.0
label:
  delta: 0.001
  t_fill_min: 15
  k_up: 3.0
  k_dn: 4.0
  n_v: 16
  bar_minutes: 15
  s_slip: 0.0005
  fill_rule: strict
  # null なら /spot/pairs の maker_fee_rate_quote / taker_fee_rate_quote を使う（2026-09-23 時点で 0 / 0.001）。
  # 課金通貨と符号は【要検証】V6（実取引の trade_history で確認）
  maker_fee: null
  taker_fee: null
features:
  # 価格帯別出来高・TPO（bbresearch/profile.py）。直近 24 時間、刻みは σ に比例（オーナー決定、2026-09-23）
  profile: true
  profile_window_hours: 24
  profile_bin_sigma: 0.25
  # 収益率の分布のパラメータ推定とその変化（bbresearch/distfeat.py）。正規分布と t 分布、窓 4・16・96 本（オーナー決定、2026-09-23）
  dist: true
  dist_windows: [4, 16, 96]
model:
  kinds: [logit, lgbm]
  n_splits: 5
  embargo_bars: 8                 # 初期値 N_v 本分
  min_train: 100
  use_weights: true
backtest:
  initial_capital: 1000000        # 円。【未決】U2 の運用資金とは別の、比較用の仮の値
  max_fraction: 1.0
  thetas: [0.5, 0.55, 0.6]
  size_step: 0.0
  n_random: 20
experiment_log: reports/experiments.jsonl
