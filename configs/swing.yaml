# スイング（4 時間足で判断し 1〜3 日保有）の方向の研究。2026-09-28 オーナー決定（docs/SPEC.md の該当節）。
# ここの数値は評価の前に固定したもの（事前登録）。評価（--mode eval）は owner_approved に日付が入ってから 1 回だけ行う。
# 評価の後に数値を変えて走らせたら、それは新しい試行として reports/experiments.jsonl に残り、デフレートシャープの試行数に入る。
owner_approved: "2026-09-28"  # オーナーが承認した日付（YYYY-MM-DD、JST）。null の間は評価を実行しない

data:
  start: "2017-02-14"         # bitbank の最古日（SPEC §9 V3）
  end: "2026-09-27"           # この日の 00:00 UTC より前の足まで
  exclude: [dai_jpy]          # データ確認で除外したペア。dai_jpy はステーブルコイン（値動きはドル円だけ）

# 対象（時点ごと）。直近 24 時間に約定があることも条件（改名などで取引が止まったペアをすぐ外す）
min_bars: 360                 # 履歴 60 日以上（最長の L = 50 日 = 300 本に余裕を足す）
turnover_days: 30
min_turnover_jpy: 30000000    # 直近 30 日の「24 時間の出来高（JPY）」の中央値が 3,000 万円以上
sigma_days: 30                # リスク均等の配分と急落の判定に使う実現ボラの窓

hold_days: [1, 2, 3]          # 保有期間（= 判断をずらす部分ポートフォリオの数 × 4 時間）

tsmom:                        # H1 時系列モメンタム: 2 × 4 × 3 = 24 通り
  kinds: [ret, ma]            # ret: 直近 L 日のリターンが正、ma: 終値が L 日移動平均以上
  lookback_days: [5, 10, 20, 50]
xsmom:                        # H2 横断モメンタム: 3 × 3 = 9 通り
  lookback_days: [5, 10, 20]
  top_k: 3
rebound:                      # H3 急落後の反発: 2 × 2 × 3 = 12 通り
  window_bars: [6, 18]        # 急落を測る窓: 1 日、3 日
  k_sigma: [2, 3]

cost:
  slippage: 0.001             # 片側。手数料（/spot/pairs のテイカー率）に足す
  stress_mult: 2.0            # 費用を 2 倍にした感度（試行には数えない）

judge:                        # 仮説ごとに、3 つとも満たせば「支持」
  min_share_alpha_pos: 0.667  # (1) 常時保有に対するアルファが正の組み合わせの割合
  min_dsr: 0.95               # (2) アクティブのシャープが最大の組み合わせのデフレートシャープ（試行数 = 45）
  min_year_share: 0.6         # (3) その組み合わせの年ごとのアクティブリターンが正の年の割合
  full_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
