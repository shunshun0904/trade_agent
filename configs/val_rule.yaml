# ルール A: 価格帯別出来高のバリューエリア下端（VAL）での反発（python -m bbresearch val-rule）。
# 数値は 2026-09-24 にオーナーと合意して検証前に固定した。結果を見て変えない。
# 評価は全期間（data.start 〜 data.end）で1回だけ。良ければ発注しないドライランで前向きに確かめる。
params:
  window_hours: 24        # 直近 24 時間の移動窓（オーナー決定）
  bin_sigma: 0.25         # 価格帯の刻み（σ に比例、オーナー決定）
  value_area: 0.70
  min_reward: 0.003       # POC と VAL の差が VAL の 0.3% 以上のときだけ発注
  valid_min: 60           # 買い指値の有効時間（分）
  stop_frac: 0.5          # 損切り = VAL − 0.5 × (POC − VAL)（成行）
  hold_min: 240           # 時間切れ（分）。指値で売り、grace_min 分で成行に切り替え
  grace_min: 15
n_control: 5              # 比較対象（VAL と無関係な深さの指値）の繰り返し回数
