<title>Portfolio Monitor</title>
<style>:root{color-scheme:dark;--bg:#0b0e14;--panel:#111621;--ink:#e6ebf2;--ink2:#9aa4b5;--line:#222a3a;--vp:#3b8fe8;--poc:#f5b32b;--up:#22c58a;--down:#f2524f}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans JP","Hiragino Sans",system-ui,sans-serif;font-size:13px}.app{max-width:1100px;margin-inline:auto;padding-block:14px 30px;padding-inline:16px;display:grid;gap:12px}h1{font-size:16px;margin:0}h2{font-size:13px;margin:0 0 8px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.tile{border-top:2px solid var(--line);padding-top:4px}.tile .k{font-size:11px;color:var(--ink2)}.tile .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:18px;font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th{text-align:left;color:var(--ink2);font-weight:500;font-size:11px;border-bottom:1px solid var(--line);padding:3px 6px}td{padding:4px 6px;border-bottom:1px solid #1a2130}td.n,th.n{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace}svg text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;fill:var(--ink2)}.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2)}.legend i{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:middle}.note{color:var(--ink2);font-size:12px}.pos{color:var(--up)}.neg{color:var(--down)}.wrap{overflow-x:auto}</style>
