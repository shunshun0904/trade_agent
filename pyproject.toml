[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-agent"
version = "0.1.0"
description = "BTC/JPY multi-agent trading system (bitbank spot, long only)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0,<2.0.0",
    "pydantic>=2.7,<3.0",
    "requests>=2.31,<3.0",
    "PyYAML>=6.0,<7.0",
    "boto3>=1.34,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
trade-agent = "trade_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:trade_agent.*"]

[tool.coverage.run]
source = ["trade_agent"]
